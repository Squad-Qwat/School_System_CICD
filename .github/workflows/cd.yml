name: Continuous Deployment

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, Package & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      jar_name: ${{ steps.version.outputs.jar_name }}
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Get version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          JAR_NAME="${ARTIFACT}-${VERSION}.jar"
          # lowercase full repo name untuk ghcr.io
          IMAGE_TAG="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "jar_name=${JAR_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git show-ref --tags --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists! Please update project.version in pom.xml to release a new version."
            exit 1
          else
            echo "Tag $TAG does not exist yet. Proceeding with release..."
          fi

      - name: Build JAR (skip tests — already run in CI)
        run: mvn package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="${{ steps.version.outputs.image_tag }}"
          VERSION_TAG="${IMAGE}:v${{ steps.version.outputs.version }}-${{ github.run_number }}"
          LATEST_TAG="${IMAGE}:latest"

          docker build \
            --no-cache \
            -t "${LATEST_TAG}" \
            -t "${VERSION_TAG}" \
            .

      - name: Push Docker image
        run: |
          IMAGE="${{ steps.version.outputs.image_tag }}"
          VERSION_TAG="${IMAGE}:v${{ steps.version.outputs.version }}-${{ github.run_number }}"
          LATEST_TAG="${IMAGE}:latest"

          docker push "${LATEST_TAG}"
          docker push "${VERSION_TAG}"
      # softprops/action-gh-release@v2 — tidak ada warning set-output
      - name: Create GitHub Release & attach JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          body: |
            Automated release from commit ${{ github.sha }}
            Branch: main
          draft: false
          prerelease: false
          files: ./target/${{ steps.version.outputs.jar_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to VPS
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "${IMAGE}"

            docker stop school-system 2>/dev/null || true
            docker rm   school-system 2>/dev/null || true

            docker run -d \
              --name school-system \
              --restart unless-stopped \
              --network caddy_net \
              -e TERM=xterm-256color \
              "${IMAGE}"

            sleep 3
            docker ps | grep school-system && echo "Deploy success" || echo "Container not running"
