name: Continuous Deployment

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # squad-qwat/school_system_cicd

jobs:
  release:
    name: Build, Package & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create GitHub Release
      packages: write # needed to push to ghcr.io

    outputs:
      version: ${{ steps.version.outputs.version }}
      jar_name: ${{ steps.version.outputs.jar_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Get version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          JAR_NAME="${ARTIFACT}-${VERSION}.jar"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "jar_name=${JAR_NAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, JAR: ${JAR_NAME}"

      - name: Build JAR (skip tests — already run in CI)
        run: mvn package -DskipTests -B

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          release_name: "Release v${{ steps.version.outputs.version }} (#${{ github.run_number }})"
          body: |
            Automated release from commit ${{ github.sha }}
            Branch: main
          draft: false
          prerelease: false

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/${{ steps.version.outputs.jar_name }}
          asset_name: ${{ steps.version.outputs.jar_name }}
          asset_content_type: application/java-archive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}-${{ github.run_number }}

  deploy:
    name: Deploy to VPS
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Login to ghcr.io (uses GITHUB_TOKEN as password)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove old container (ignore error if not running)
            docker stop school-system 2>/dev/null || true
            docker rm school-system 2>/dev/null || true

            # Start new container — no ports exposed to host, only on caddy_net
            docker run -d \
              --name school-system \
              --restart unless-stopped \
              --network caddy_net \
              -e TERM=xterm-256color \
              ghcr.io/${{ github.repository }}:latest

            # Verify it started
            sleep 3
            docker ps | grep school-system && echo "✅ Deploy success" || echo "❌ Container not running"
