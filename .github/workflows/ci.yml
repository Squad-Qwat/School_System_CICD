name: CI

on:
  push:
    branches: ["main", "dev", "feat/*", "dev-*"]
  pull_request:
    branches: ["main", "dev", "dev-*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests
      # - name: Run the ProjectMain.java
      #   run: mvn clean compile exec:java "-Dexec.mainClass=com.mycompany.Aktivitas.ProjectMain" --file pom.xml
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run Tests
      run: mvn test --file pom.xml
  sonnarcloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=squad-qwat -Dsonar.projectKey=Squad-Qwat_School_System_CICD
